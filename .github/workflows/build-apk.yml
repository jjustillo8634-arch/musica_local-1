name: Compilar APK Flutter

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Obtener dependencias
        run: flutter pub get

      - name: Ejecutar script de parche si existe
        run: |
          if [ -f tools/patch_android.py ]; then
            python3 tools/patch_android.py
          fi

      - name: Compilar APK
        run: flutter build apk --release

      - name: Guardar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: reproductor-musica-apk
          path: build/app/outputs/flutter-apk/app-release.apk
